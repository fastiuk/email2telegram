name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# a newer push to the same branch or PR supersedes the running check
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        persist-credentials: false

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag email2telegram:test

    - name: Fail fast without required settings
      run: "! docker run --rm email2telegram:test"

    - name: End-to-end test
      run: tests/e2e.sh email2telegram:test
