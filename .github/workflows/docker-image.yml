name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag email2telegram:test

    - name: Fail fast without required settings
      run: "! docker run --rm email2telegram:test"

    - name: End-to-end test
      run: tests/e2e.sh email2telegram:test
